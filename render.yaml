# Deploy no Render (render.com): "New +" → "Blueprint" → aponte para este
# repositório. Cria a API automaticamente; a base de dados é o Neon (neon.tech,
# grátis para sempre, sem expirar) — não a Postgres do próprio Render, que
# expira aos 30 dias no plano gratuito.
#
# Antes de aplicar este blueprint:
#   1. Crie um projecto grátis em https://neon.tech
#   2. Copie a "connection string" que o Neon fornece
#   3. Depois do Render criar o serviço "marca-ja-api", vá a
#      Environment → adicione DATABASE_URL manualmente com essa connection
#      string (o Render pede isto porque a variável está marcada "sync: false"
#      abaixo — não pode vir dele, vem de fora).
services:
  - type: web
    name: marca-ja-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: "15m"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173"
